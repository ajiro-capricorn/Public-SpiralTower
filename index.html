<style>
:root{
  color-scheme: dark;
  --ink:#15131d; --panel:#1e1b29; --panel2:#282436; --line:#373149;
  --text:#ece6d6; --muted:#9e97b0; --brass:#e3aa4c; --brass-d:#8f6724;
  --mint:#9fe3c4; --mint-d:#4d8a72; --red:#ff6b5e; --red-d:#8a3a3a;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
[hidden]{display:none!important}
html,body{height:auto}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--dot);}
.wrap{margin:0 auto;padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.game{--gw:640px;width:var(--gw);max-width:100%;font-size:calc(var(--gw) * .039);display:flex;flex-direction:column;gap:.4em}
.topbar{display:flex;justify-content:flex-end;gap:.3em}
.tbtn{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:3px;cursor:pointer}
.tbtn:hover{background:var(--panel2)}
.topbar .tbtn{font-size:max(12px,.55em);padding:.3em .8em}
.topbar .tbtn{white-space:nowrap}.game.narrow .topbar{gap:3px}.game.narrow .topbar .tbtn{padding:.3em .45em;font-size:max(11px,.55em)}
#btnLog{margin-right:auto}.tbtn:disabled{opacity:.35;cursor:default}
.card .navbtns{display:flex;gap:8px;flex-wrap:wrap}
.card .loglist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.card .loglist li{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.card .fxline b.em{font-weight:400}
.card .fxline{font-size:18px;line-height:1.6;display:flex;flex-wrap:wrap;column-gap:1em}
@media (max-width:420px){.card .fxline{font-size:16.5px}}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:2px solid var(--line);border-radius:4px;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
#cv.pt{cursor:pointer}
.pad{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:space-between;padding-inline:3%;pointer-events:none}
.cbtn{pointer-events:auto;width:max(40px,2.7em);height:max(40px,2.7em);font:inherit;font-size:1.05em;color:var(--text);background:rgba(18,16,28,.72);border:2px solid rgba(90,82,116,.9);border-radius:4px;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;padding:0}
.cbtn:active,.cbtn.held{background:rgba(52,46,72,.92)}
.cbtn.glow{box-shadow:0 0 0 2px rgba(170,235,255,.8),0 0 22px 8px rgba(90,200,255,.65);animation:arrowglow 1.96s ease-in-out infinite}
@keyframes arrowglow{0%,100%{box-shadow:0 0 0 2px rgba(170,235,255,.55),0 0 12px 3px rgba(90,200,255,.4)}50%{box-shadow:0 0 0 2px rgba(170,235,255,1),0 0 30px 12px rgba(90,200,255,.9)}}
.cbtn.locked,.cbtn.locked:active{color:rgba(170,164,190,.3);border-color:rgba(90,82,116,.35);background:rgba(18,16,28,.42)}
.cbtn.off,.cbtn.off:active{color:rgba(170,164,190,.3);border-color:rgba(90,82,116,.35);background:rgba(18,16,28,.42);cursor:default}
#title:not([hidden]) ~ .pad,#cut:not([hidden]) ~ .pad{visibility:hidden}
.ending{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:7%;gap:.4em;pointer-events:none;text-align:center}
.ending h2{margin:0;font-size:2em;font-weight:400;letter-spacing:.3em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.gostart{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;place-items:center;overflow:hidden;container-type:size}
.gs-band{position:absolute;left:0;right:0;top:22%;height:56%;background:rgba(12,10,18,.82);border-block:2px solid var(--brass);transform:scaleY(0);animation:gsBand 2.8s cubic-bezier(.2,.8,.2,1) forwards}
.gs-band::before,.gs-band::after{content:'';position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(-45deg,#c8413b 0 6px,#f6f3ec 6px 12px,#2d5d9f 12px 18px,#f6f3ec 18px 24px);background-size:34px 34px;animation:gsPole .6s linear infinite}
.gs-band::before{top:5px}.gs-band::after{bottom:5px;animation-direction:reverse}
.gs-txt{position:relative;display:flex;flex-direction:column;align-items:center;font-family:var(--round);font-weight:800;line-height:1}
.gs-step{font-size:7cqh;letter-spacing:.4em;padding-left:.4em;color:var(--brass);opacity:0;animation:gsStep 2.8s ease-out forwards}
.gs-start{margin-top:.14em;font-size:min(22cqh,16cqw);letter-spacing:.14em;padding-left:.14em;color:#fff;text-shadow:0 3px 0 var(--brass-d),0 0 18px rgba(227,170,76,.75);opacity:0;animation:gsStart 2.8s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes gsBand{0%{transform:scaleY(0)}8%{transform:scaleY(1)}84%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
@keyframes gsPole{to{background-position:34px 0}}
@keyframes gsStep{0%,5%{opacity:0;transform:translateX(60%)}17%{opacity:1;transform:translateX(0)}80%{opacity:1;transform:translateX(0)}92%,100%{opacity:0;transform:translateX(-60%)}}
@keyframes gsStart{0%,24%{opacity:0;transform:scale(2.6)}31%{opacity:1;transform:scale(.92)}36%{transform:scale(1.04)}40%{transform:scale(1)}44%{text-shadow:0 3px 0 var(--brass-d),0 0 34px #fff}80%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1.25)}}
.ending p{margin:0;font-size:max(11px,.55em);color:#1f2530;background:rgba(255,255,255,.75);padding:3px 10px;border-radius:2px}
.cut{position:absolute;inset:0;z-index:3;background:var(--panel);display:flex;flex-direction:column}
.cut-head{display:flex;align-items:center;justify-content:flex-end;gap:.5em;padding:.25em .4em .25em .6em;border-bottom:1px solid var(--line);flex:none}
.cut-head h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.cut-head .gbtn{font-size:max(12px,.55em);padding:.3em .9em;color:#fff;border-color:rgba(255,255,255,.7)}
.cut-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.3em;padding:.3em}
.cut-art{display:flex;justify-content:center;flex:1 1 auto;min-height:0}
.cut-art > svg{width:100%;height:100%;display:block}
.cut-art.is-sheet .sheet{display:flex;flex-direction:column;height:100%}
.cut-art.is-sheet .sheet .tag,.cut-art.is-sheet .sheet .rule{flex:none;align-self:flex-start}
.cut-art.is-sheet .sheet .rule{align-self:center}
.cut-art.is-sheet .sheet svg{flex:1 1 auto;min-height:0;width:100%;height:100%}
.cut-art .hit{cursor:pointer}
.cut-art .hit:hover{filter:brightness(1.18)}
.cut-extra{display:flex;flex-direction:column;gap:.3em;font-size:max(12px,.6em)}
.cut-extra:empty{display:none}
.msgbox{height:5.2em;background:#110f18;border:1px solid var(--line);border-radius:3px;padding:.3em .7em;box-sizing:border-box;flex:none}
.msg{height:100%;overflow:hidden;line-height:2.1}
.msg .ph{color:#5d5770}
.msg .em{color:#6fc8ff}
.rw{font:inherit;color:var(--red);background:none;border:0;padding:0 .05em;margin:0;cursor:default;line-height:inherit}
.rw.on{cursor:pointer}
.rw.on:hover{background:rgba(255,107,94,.12)}

svg .rws{fill:#e0453a;cursor:default}
svg .rws.on{cursor:pointer}
form.ans{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.15em}
.ans-row{display:flex;gap:.4em}
form.ans input{font:inherit;font-size:.9em;flex:1;min-width:0;background:#0b0a10;color:var(--text);border:1px solid var(--brass-d);border-radius:3px;padding:.2em .5em}
form.ans .pbtn{font-size:.75em;padding:.3em .9em;align-self:auto}
form.ans .fb{font-size:.7em;min-height:1.4em;line-height:1.4}
form.ans .fb.note{color:var(--text)}
.abil{font-size:.82em;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;display:flex;flex-direction:column;gap:.35em;flex:none}
.abil.off{visibility:hidden}
.ab-grid{display:grid;grid-template-columns:1fr auto 5.4em;grid-template-rows:auto auto;gap:.35em .4em;align-items:stretch}
.ab-b{grid-column:1;grid-row:1}.ab-c{grid-column:2;grid-row:1;margin-left:.45em}.ab-side{grid-column:3;grid-row:1}
.ab-a{grid-column:1 / 3;grid-row:2}.ab-go{grid-column:3;grid-row:2}
.fld{display:flex;align-items:stretch;gap:.3em;min-width:0}
.fld .lab{font-size:max(11px,.85em);color:#b3abc6;align-self:center;flex:none;line-height:1.15;text-align:center}
.fld .slot{flex:1}
.fcol{flex:1;display:flex;flex-direction:column;gap:.15em;min-width:0}
.fcol>.slot{width:100%;flex:1 1 auto}
.marks{display:flex;height:1.1em;line-height:1.1em;padding-left:calc(.45em + 1px);flex:none;overflow:hidden}
.marks span{width:1.16em;flex:none;text-align:center;border-right:1px solid transparent}
.marks span:first-child{border-left:1px solid transparent}
.marks .o{color:#6fe3a0}.marks .x{color:#a59dbb}
.fld.mk .lab{margin-top:1.25em}
.slot{font:inherit;min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;background:#110f18;border:1px dashed var(--line);border-radius:3px;padding:.3em .45em .35em;color:var(--text);cursor:pointer;text-align:left;overflow:hidden}
.slot.act{border-style:solid;border-color:var(--brass)}
.wipe{position:absolute;left:50%;top:50%;width:58%;transform:translate(-50%,-50%);z-index:6;border:3px solid #e8e3f0;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.6);background:#000;animation:wipein .35s ease-out}
.wipe canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.wipe.out{animation:wipeout .3s ease-in forwards}
body.practice #abil .fld,body.practice #abGo{position:relative;z-index:11}
body.practice.picking #abil .fld{z-index:auto}
@keyframes wipein{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes wipeout{to{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
.moviecap{position:fixed;inset:0;z-index:15;cursor:wait}
.pickdim{position:fixed;inset:0;background:rgba(6,5,10,.62);z-index:20;cursor:pointer;overflow:hidden}
.pickdim.spot{background:transparent}
.pickspot{display:none;position:absolute;border:2px solid #ffd88c;border-radius:4px;box-shadow:0 0 0 200vmax rgba(6,5,10,.62),0 0 12px rgba(255,216,140,.9);pointer-events:none}
.pickdim.spot .pickspot{display:block}
.pickcap{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#16131f;border:1px solid #6fc8ff;color:#dff3ff;border-radius:4px;padding:6px 12px;font-size:14px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
body.picking #slA,body.picking #slB{position:relative;z-index:21;border-style:solid;border-color:#6fc8ff;box-shadow:0 0 0 1px #6fc8ff,0 0 14px rgba(111,200,255,.75);animation:pickglow 1.1s ease-in-out infinite alternate;background:#141826}
body.picking .ab-a .lab,body.picking .ab-b .lab{position:relative;z-index:21;color:#dff3ff;text-shadow:0 0 6px rgba(111,200,255,.9)}
@keyframes pickglow{from{box-shadow:0 0 0 1px #6fc8ff,0 0 6px rgba(111,200,255,.45)}to{box-shadow:0 0 0 1px #9fdcff,0 0 16px rgba(111,200,255,.9)}}
.slot .v{display:flex;flex-direction:column;gap:.18em;min-width:0}
.slot .nm{font-size:.72em;line-height:1.25;color:#cfc8de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.25em}
.slot .cells{display:flex;flex:none}
.slot .cell{width:1.16em;height:1.45em;line-height:1.45em;text-align:center;border-right:1px dotted #625a76;color:#ece7f4;flex:none}
.slot .cell:first-child{border-left:1px dotted #625a76}
.slot .cell.g{color:#6fe3a0}
.gobtn{font:inherit;font-size:.95em;letter-spacing:.06em;white-space:nowrap;background:var(--brass);color:#22180a;border:0;border-radius:3px;padding:0 .8em;cursor:pointer}
.gobtn:disabled,.gobtn.dim{opacity:.35;cursor:default}
.vc{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.vc button{font:inherit;background:#110f18;color:#ffd88c;border:0;padding:.1em .6em;font-size:.9em;cursor:pointer}
.vc button.flip{color:var(--muted);font-size:.75em;border-left:1px solid var(--line);padding:.1em .5em}
.vc.sel{border-color:var(--brass)}
.vc.sel button:first-child{background:#2a2233}
.letters{display:flex;flex-wrap:nowrap;overflow:hidden;gap:.2em;font-size:.95em;height:1.6em;align-items:center}
.letters span{display:inline-block;flex:none;min-width:1.25em;text-align:center;padding:0 .1em;border-radius:2px;border:1px solid var(--line);color:#6d6680;line-height:1.35}
.letters span.b{color:var(--mint);border-color:var(--mint-d)}
.letters span.c{color:#ffd88c;border-color:var(--brass-d)}
.letters span.miss{color:#ff8c8c;border-color:var(--red-d);border-style:dashed}
.letters span.sep{border:0;min-width:.4em;color:var(--muted);font-size:.7em}
.flipbtn{font:inherit;width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;background:#110f18;color:#ffd88c;border:1px solid var(--brass-d);border-radius:3px;cursor:pointer;padding:.15em 0;line-height:1.05;font-size:1.05em}
.flipbtn .flipico{width:1.95em;height:1.56em;vertical-align:0}.flipbtn .flipico path{stroke-width:1.5}
.flipbtn:active{background:#2a2233}
.ab-side{display:flex;flex-direction:column;gap:.15em}.ab-side::before{content:'';height:1.1em;flex:none}
.flipico{width:1.3em;height:1.04em;display:inline-block;vertical-align:-.12em}
.card .flipico{color:#ffd88c}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(8,7,12,.76);display:grid;place-items:center;padding:16px;z-index:10}
#modal{align-items:start;padding-block:8px;overflow:hidden}
#modal .card{max-height:calc(100dvh - 16px);overflow-x:hidden}
.card{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.card h2{margin:0;font-size:20px;font-weight:400;letter-spacing:.12em}
.card p{margin:0;line-height:1.75}
.card p.big{font-size:1.2em;line-height:1.7}
.card .note{color:var(--muted);font-size:13px}
.card .lead{font-size:clamp(15px,4vw,22px);line-height:1.6;padding:.3em 0}
@media (max-width:420px){.card{padding:16px;font-size:15px}}
.card.intro{font-size:18px}.card.intro .note{font-size:15px}.card.intro .lead{font-size:clamp(17px,4.4vw,22px)}
@media (max-width:420px){.card.intro{font-size:16.5px}.card.intro .note{font-size:14px}}
.card img.robo{width:96px;image-rendering:pixelated;align-self:center;margin:4px 0 8px}
.ctlshot{position:relative}
.ctlshot .cbtn{position:absolute;left:3%;bottom:8%;width:10.5%;height:auto;aspect-ratio:1/1;font-size:clamp(12px,3.4vw,18px);pointer-events:none}
.ctlshot .cbtn.r{left:auto;right:3%}
.card img.shot{width:100%;box-sizing:border-box;image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;display:block}
.card .em{color:#6fc8ff}
.card .navbtns .pbtn:disabled{opacity:.35;cursor:default}
.card .prac2{border:1px dashed #6fc8ff;border-radius:4px;padding:.5em .7em}
.card .prac2.done{border-style:solid;border-color:#6fe3a0;color:#6fe3a0}
.card svg.fig{width:78%;height:auto;display:block;margin:0 auto;background:#0f0d16;border:1px solid var(--line);border-radius:3px;flex:none}
.card .abil.mock{font-size:13px;pointer-events:none;flex:none}
.card .abil.mock .gobtn{display:grid;place-items:center}
.card .abil.cmock{position:relative;align-self:center;font-size:16px;padding:.6em 1em}.card .cmock .ab-c{margin-left:0}
.card .cmock .mcur{position:absolute;width:22px;height:30px;right:28%;bottom:-6px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.card .ex{display:flex;flex-direction:column;gap:4px}
.card .ex .mk{font-size:15px}.card .ex .mk b{font-weight:400;color:#6fe3a0}.card .ex .mk b.x{color:#c9c2d9}
@media (max-width:420px){.card .abil.mock{font-size:12px;padding:.35em .45em}}
.card ul{margin:0;padding-left:1.2em;line-height:1.85;font-size:15px}
.card table{border-collapse:collapse;font-size:15px}
.card td{padding:4px 10px 4px 0;vertical-align:top}
.pbtn{font:inherit;font-size:16px;background:var(--brass);color:#22180a;border:0;border-radius:3px;padding:10px 16px;cursor:pointer;letter-spacing:.1em;align-self:flex-start}
.gbtn{font:inherit;font-size:14px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;align-self:flex-start}
.fb{min-height:1.6em;color:var(--brass)}
.sq{font-size:clamp(15px,2.6vw,18px);line-height:2.3}
.spin{display:inline-flex;align-items:stretch;vertical-align:middle;gap:2px;border:1px solid var(--brass-d);border-radius:3px;background:#110f18;margin:.15em;padding:1px}

.reel{display:inline-flex;flex-direction:column;align-items:center;background:#0b0a10;border-radius:2px}

.card .navsp{flex:1}

.sheet-svg{--bg:#e9e4d8;--paper:#fbf8f1;--ink:#2b2a28;--sub:#77726a;--line:#d8d1c2;--frame:#9a958c;

<div class="wrap">
 <div class="game" id="game">
  <div class="topbar">

  <div class="stage" id="stage">

    <div class="ending" id="ending" hidden>

    </div>
    <div class="title" id="title">
      <h1 class="logo" aria-label="螺旋塔からの脱出"><span class="l-big">螺旋塔</span><span class="l-small">からの脱出</span></h1>
      <div class="t-btns">
        <button class="pbtn" id="tStart" type="button">はじめる</button>
      </div>
      <div class="t-sound" role="group" aria-label="音"><span>音</span><button class="tsnd" type="button" data-on="1" aria-pressed="true">あり</button><button class="tsnd" type="button" data-on="0" aria-pressed="false">なし</button></div>
    </div>
    <section class="cut" id="cut" hidden aria-live="polite">
      <div class="cut-head"><h2 id="cutTitle"></h2><button class="gbtn" id="cutClose" type="button">もどる</button></div>
      <div class="cut-body"><div class="cut-art" id="cutArt"></div><div class="cut-extra" id="cutExtra"></div></div>
    </section>
    <div class="pad">
      <button class="cbtn" id="bL" type="button" aria-label="左">◀</button>
      <button class="cbtn" id="bR" type="button" aria-label="右">▶</button>
    </div>
  </div>

  <div class="msgbox" id="msgbox">
    <div class="msg" id="msg" aria-live="polite"><span class="ph">画面の物を クリックすると、調べられる。</span></div>
    <form class="ans" id="ansBox" hidden>
      <div class="ans-row"><input id="ansIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを ひらがなで" aria-label="答え"><button class="pbtn" type="submit">こたえる</button></div>
      <p class="fb" id="fb"></p>
    </form>
  </div>

  <section class="abil off" id="abil" aria-label="能力">
    <div class="ab-grid">
      <div class="fld ab-b mk"><span class="lab">対<br>象</span><div class="fcol"><div class="marks" id="mkB" aria-hidden="true"></div><button class="slot" id="slB" type="button" data-slot="B" aria-label="対象"><span class="v"></span></button></div></div>
      <div class="fld ab-c mk"><span class="lab">変<br>化</span><div class="fcol"><div class="marks" id="mkC" aria-hidden="true"></div><button class="slot" id="slC" type="button" data-slot="C" aria-label="効果"><span class="v c"></span></button></div></div>
      <div class="ab-side" id="abSide"></div>
      <div class="fld ab-a"><span class="lab">範<br>囲</span><button class="slot act" id="slA" type="button" data-slot="A" aria-label="範囲"><span class="v"></span></button></div>
      <button class="gobtn ab-go" id="abGo" type="button" disabled>改変</button>
    </div>
  </section>

  <div class="end-btns" id="endbar" hidden>
    <a class="tbtn" id="btnShare" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">結果を共有</a>
    <button class="tbtn" id="btnCredit" type="button">クレジット</button>
  </div>
 </div>

</div>

  if(!AU.c||!AU.on)return;const c=AU.c,t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);

}

  [['leaf',0],['coil',1],['rainbow',2],['bloom',3],['needle',4],['treeTall',5],['stretched',6],['treeUp',8]].forEach(([k,i])=>{if(S[k])S.m[i]=true;});if(S.treeUp)S.cleared[2]=true;delete S.dropped;if(S.needle)S.flipOK=true;if(S.m[7]&&!S.gotCards){S.gotCards=true;S.vocab.push('ochiru','omoku');}
  if(S.logo!=='floor'&&S.logo!=='up')S.logo='floor';['hw','p','warned'].forEach(k=>delete S[k]);if(S.mode==='head'||S.mode==='exit'){S.mode='wide';if(S.exitF===null)S.exitF=S.f;S.wf=S.exitF;}
  if(S.f===SKIP_FACE)S.f=DOOR_FACE;S.g=S.f;
  if(S.mode==='wide'){endShown=true;windT=10;wfDisp=S.wf;showEnding();}
  else S.mode='play';
  cam=S.g;updateHud();say(msg||'つづきから。');
  if(S.mode==='play'&&S.light&&S.logo==='up'&&!S.raised)setTimeout(liftOff,600);
}

const titleEl=$('#title');
function showTitle(){
  const sv=loadSave();$('#tStart').textContent=sv?'つづきから':'はじめる';
  $('#btnReset').disabled=!sv;
  titleEl.hidden=false;
}
$('#tStart').addEventListener('click',()=>{
  titleEl.hidden=true;started=true;auInit();$('#btnReset').disabled=false;
  const sv=loadSave();if(sv)resume(sv);else{restart();openHelp(true);}
});

const RESET_HOLD=3000;
$('#btnReset').addEventListener('click',()=>{sfx.blip();openReset();});
function openReset(){
  openModal(`<h2>リセット</h2>
    <p>ゲームの進行をすべて消して、最初の状態に戻します。<br>リセットすると、${emS('元には戻せません')}。</p>
    <p>リセットは${emS('謎解きとは関係ありません')}。謎を解くために押す必要はありません。</p>
    <p>実行するには、下のボタンを${emS('3秒間長押し')}してください。</p>
    <div class="navbtns"><button class="pbtn hold" id="resetHold" type="button"><span class="fill"></span><span class="lbl">長押しでリセット</span></button><button class="gbtn" data-close type="button">やめる</button></div>`);
  const b=$('#resetHold'),fill=b.querySelector('.fill');let t0=0,raf=0;
  const stop=()=>{cancelAnimationFrame(raf);t0=0;fill.style.width='0';};
  const tick=()=>{const u=Math.min(1,(performance.now()-t0)/RESET_HOLD);fill.style.width=u*100+'%';if(u>=1){t0=0;doReset();return;}raf=requestAnimationFrame(tick);};
  const start=e=>{e.preventDefault();if(t0)return;t0=performance.now();raf=requestAnimationFrame(tick);};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,stop));
  b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e);});b.addEventListener('keyup',stop);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
function doReset(){restart();started=false;closeModal();sfx.thud();showTitle();}

function showEnding(){
  $('#ending').hidden=false;$('#endbar').hidden=false;
  const share=$('#btnShare');const u=new URL('https://twitter.com/intent/tweet');
  const game=/^https?:/.test(location.protocol)?location.href.split('#')[0]:'';
  if(ANNOUNCE_URL){
    u.searchParams.set('text',['螺旋塔からロボットを救い出した！',game,'#螺旋塔脱出 #WEB謎'].filter(Boolean).join('\n'));u.searchParams.set('url',ANNOUNCE_URL);}
  else{u.searchParams.set('text','螺旋塔からロボットを救い出した！');u.searchParams.set('hashtags','螺旋塔脱出,WEB謎');if(game)u.searchParams.set('url',game);}
  share.href=u.toString();
  saveNow();
}

const hintText=x=>Array.isArray(x)?x[1]:x,hintLabel=(x,i)=>Array.isArray(x)?x[0]:`ヒント${i+1}を見る`;
function hintBody(h){
  const n=S.hint[h.id]||0,list=h.hints.slice(0,n).map(t=>`<li>${hintText(t)}</li>`).join('')+(n>h.hints.length?`<li class="ans">答え：${h.answer}</li>`:'');
  const next=n<h.hints.length?`<button class="gbtn" type="button" data-hn="${h.id}">${hintLabel(h.hints[n],n)}</button>`:n===h.hints.length&&h.answer?`<button class="gbtn" type="button" data-hn="${h.id}">${h.answerLabel||'答えを見る'}</button>`:'';
  return `<div class="hs-body">${list?`<ol class="hl">${list}</ol>`:''}${next}</div>`;
}
function hintPlace(tg){
  if(S.door)return '屋上以降';
  const k=tg==='truth'?DOOR_FACE:+Object.keys(ITEMS).find(f=>ITEMS[f].some(it=>it.id===tg));
  return Number.isFinite(k)?`${Math.floor(k/4)+1}F${COL_NAMES[k%4]}の壁`+(tg==='truth'?`：最後の問題${S.q+1}`:''):'';
}
function openHints(){
  let list,cap,tg=null;
  if(!S.door){tg=currentTarget&&currentTarget();list=HINTS.filter(h=>h.id===tg||(tg==='truth'&&h.id==='q'+(S.q+1)));cap='<p><span class="em">青く光っている謎</span>を解きましょう。</p>';}
  else{list=HINTS.filter(h=>h.when()&&!h.done());cap='<p class="note">いまの場面のヒントを、1つずつ見られます。</p>';}
  const acc=h=>h.tracks.filter(t=>!t.when||t.when()).map(t=>`<details class="hs acc" data-hid="${t.id}"><summary><span${t.em?' class="em"':''}>${t.title}</span></summary>${hintBody(t)}</details>`).join('');
  const sec=h=>h.tracks?(S.door&&!h.noHead?`<details class="hs" open><summary><span>${h.title}</span></summary><div class="hs-body">${acc(h)}</div></details>`:acc(h))
    :S.door?`<details class="hs" data-hid="${h.id}" open><summary><span>${h.title}</span></summary>${hintBody(h)}</details>`
    :`<div class="hs" data-hid="${h.id}">${hintBody(h)}</div>`;
  const place=hintPlace(tg);
  openModal(`<h2>ヒント${place?`（${place}）`:''}</h2>${cap}
    <div class="hint-list">${list.length?list.map(sec).join(''):'<p class="note">いまは、ヒントはありません。</p>'}</div>
    <button class="pbtn" data-close type="button">とじる</button>`);
  modal.querySelector('.card').classList.add('wide');
  modal.querySelector('.hint-list').addEventListener('click',e=>{const b=e.target.closest('[data-hn]');if(!b)return;
    const id=b.dataset.hn,h=HINTS.flatMap(x=>x.tracks||[x]).find(x=>x.id===id);S.hint[id]=(S.hint[id]||0)+1;sfx.blip();
    const d=modal.querySelector(`[data-hid="${id}"]`);d.querySelector('.hs-body').outerHTML=hintBody(h);saveNow();
    const nb=d.querySelector('.hs-body');(nb.querySelector('.gbtn')||nb.querySelector('li:last-child')||nb).scrollIntoView({block:'nearest'});});
  modal.querySelectorAll('details.acc').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)modal.querySelectorAll('details.acc').forEach(o=>{if(o!==d)o.open=false;});}));
}
$('#btnHint').addEventListener('click',()=>{if(!titleEl.hidden)return;openHints();});

});
